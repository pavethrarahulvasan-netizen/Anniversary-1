<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>12 Months of Us</title>
<style>
:root{--bg:#fff5f6;--card:#e11d48;--card2:#fb7185;--ink:#4a1020;--paper:#fffdf8;--muted:#9f5a68;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c0a10;--card:#be123c;--card2:#e11d48;--ink:#ffe4e9;--paper:#2b1219;--muted:#d49aa6}}
:root[data-theme="dark"]{--bg:#1c0a10;--card:#be123c;--card2:#e11d48;--ink:#ffe4e9;--paper:#2b1219;--muted:#d49aa6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh;text-align:center}
header{padding:32px 16px 8px}
h1{margin:0;font-size:clamp(1.8rem,6vw,2.8rem)}
header p{margin:8px 0 0;color:var(--muted)}
.grid{max-width:760px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{aspect-ratio:3/4;border:0;border-radius:16px;cursor:pointer;color:#fff;font:inherit;
background:linear-gradient(145deg,var(--card),var(--card2));box-shadow:0 6px 16px rgba(0,0,0,.2);
display:flex;align-items:center;justify-content:center;transition:transform .2s,opacity .6s}
.card:hover{transform:translateY(-4px) rotate(-1deg)}
.card .heart{font-size:3rem}
.card.vanish{opacity:0;transform:scale(.6) rotate(8deg);pointer-events:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.show{display:flex}
.open{background:var(--paper);border-radius:18px;max-width:380px;width:100%;padding:28px 22px;animation:pop .45s ease;box-shadow:0 10px 40px rgba(0,0,0,.4)}
@keyframes pop{from{transform:scale(.3) rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
.open h2{margin:0 0 10px;font-size:1.6rem}
.open p{margin:0 0 20px;line-height:1.5}
.btn{display:inline-block;background:var(--card);color:#fff;border:0;border-radius:999px;padding:10px 26px;font:inherit;cursor:pointer;text-decoration:none}
.song{margin:0 0 16px}
.done{display:none;margin:40px 16px;font-size:1.3rem}
footer{padding:24px;font-size:.8rem;color:var(--muted)}
footer button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit}
</style>
</head>
<body>
<header>
<h1>12 Months of Us 💍</h1>
<p>Tap a card to open your surprise. Once opened, it’s gone.</p>
</header>
<div class="grid" id="grid"></div>
<div class="done" id="done">All 12 surprises opened. Happy Anniversary! ❤️</div>
<footer><button id="reset">reset cards</button></footer>

<div class="overlay" id="overlay"><div class="open">
<h2 id="oTitle"></h2>
<p id="oText"></p>
<div class="song" id="oSongWrap"><a class="btn" id="oSong" href="#" target="_blank" rel="noopener noreferrer">🎵 Song of the Month</a></div>
<button class="btn" id="oClose">Close</button>
</div></div>

<script>
// ✏️ EDIT YOUR PLANS AND YOUTUBE LINKS HERE
const PLANS=[
{t:"Breakfast in Bed",d:"Wake up to a surprise breakfast, made just for you. No phones, no rushing.",l:"https://youtu.be/Y7ZHkpRcshQ?si=yKa1GyB3Q62AjYUF "},
{t:"Candlelight Dinner at Home",d:"Soft music, candles and your favorite meal. Just the two of us, with nowhere else to be.",l:"PASTE_LINK_2"},
{t:"Love Notes Hunt",d:"I hide little love notes around the house for you to find, and the last one leads to a surprise.",l:"PASTE_LINK_3"},
{t:"Sunset Picnic for Three",d:"A blanket, fruit, sweets and a quiet spot to watch the sun go down, with the three of us together.",l:"PASTE_LINK_4"},
{t:"Day Trip Adventure",d:"We pack snacks and go somewhere new for the day, a beach, a hill or a small town.",l:"PASTE_LINK_5"},
{t:"Stargazing and Wishes",d:"We lie under the stars with warm blankets and hot chocolate, and tell each other our biggest dreams.",l:"PASTE_LINK_6"},
{t:"Surprise Mystery Day",d:"One of us plans the entire day in secret. The other only gets clues, with no questions allowed.",l:"PASTE_LINK_7"},
{t:"Cook-Off Challenge",d:"We each make a dish for the other, then rate each other’s cooking. The winner picks the next date.",l:"PASTE_LINK_8"},
{t:"Slow Dance in the Living Room",d:"We put on our song, dim the lights and dance slowly, holding each other close.",l:"PASTE_LINK_9"},
{t:"Spa Night at Home",d:"Face masks, massages, soft music and candles. A full night of relaxing together.",l:"PASTE_LINK_10"},
{t:"Letters to Our Future",d:"We each write a letter about our hopes for the years ahead, seal it, and promise to open it together on a future anniversary.",l:"PASTE_LINK_11"},
{t:"Your Wish Day",d:"Any day we both feel like it, you choose the plan and I follow along. No questions asked, and no limits.",l:"PASTE_LINK_12"}
];
const KEY="anniv-opened";
let opened=[];
try{opened=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(opened))}catch(e){}}
const grid=document.getElementById("grid"),done=document.getElementById("done");
const ov=document.getElementById("overlay");
let current=null;
function render(){
  grid.innerHTML="";
  PLANS.forEach((p,i)=>{
    if(opened.includes(i))return;
    const b=document.createElement("button");
    b.className="card";b.setAttribute("aria-label","Surprise card");
    b.innerHTML='<span class="heart">💌</span>';
    b.onclick=()=>openCard(i,b);
    grid.appendChild(b);
  });
  done.style.display=opened.length>=PLANS.length?"block":"none";
}
function openCard(i,el){
  current={i,el};
  const p=PLANS[i];
  document.getElementById("oTitle").textContent=p.t;
  document.getElementById("oText").textContent=p.d;
  const wrap=document.getElementById("oSongWrap"),a=document.getElementById("oSong");
  if(p.l&&p.l.indexOf("http")===0){a.href=p.l;wrap.style.display="block"}
  else{wrap.style.display="none"}
  ov.classList.add("show");
}
function closeCard(){
  ov.classList.remove("show");
  if(!current)return;
  const {i,el}=current;current=null;
  if(!opened.includes(i)){opened.push(i);save()}
  el.classList.add("vanish");
  setTimeout(render,600);
}
document.getElementById("oClose").onclick=closeCard;
document.getElementById("reset").onclick=()=>{opened=[];save();render()};
render();
</script>
</body>
</html>
